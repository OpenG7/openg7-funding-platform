services:
  traefik:
    image: traefik:v3.7.13
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesResolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
      - '${TRAEFIK_DASHBOARD_BIND:-127.0.0.1:8081}:8080'
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/routes.yml:ro
      - ./traefik/acme:/letsencrypt
    networks:
      - edge
    restart: unless-stopped
    cpus: '0.50'
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    image: ${API_IMAGE:-openg7-funding-api:local}
    build:
      context: .
      dockerfile: apps/funding-api/Dockerfile
    environment:
      # Explicit API settings only: no bootstrap/migration, backup or SSH credentials.
      NODE_ENV: production
      FUNDING_PLATFORM_ENV: ${FUNDING_PLATFORM_ENV:-production}
      FUNDING_API_PORT: 3333
      APP_DOMAIN: ${APP_DOMAIN:-openg7.org}
      FUNDING_PUBLIC_BASE_URL: ${FUNDING_PUBLIC_BASE_URL:-https://openg7.org}
      FUNDING_ALLOWED_ORIGINS: ${FUNDING_ALLOWED_ORIGINS:-https://openg7.org,https://www.openg7.org}
      FUNDING_ALLOWED_AMOUNTS: ${FUNDING_ALLOWED_AMOUNTS:-5,10,25,50}
      FUNDING_BUSINESS_SPONSORSHIP_ENABLED: ${FUNDING_BUSINESS_SPONSORSHIP_ENABLED:-false}
      FUNDING_ADMIN_TOKEN: ${FUNDING_ADMIN_TOKEN:-}
      FUNDING_ADMIN_SESSION_SECRET: ${FUNDING_ADMIN_SESSION_SECRET:-}
      FUNDING_ADMIN_SESSION_TTL_MINUTES: ${FUNDING_ADMIN_SESSION_TTL_MINUTES:-60}
      FUNDING_ADMIN_AUTH_MODE: ${FUNDING_ADMIN_AUTH_MODE:-oidc}
      FUNDING_KEYCLOAK_ENABLED: ${FUNDING_KEYCLOAK_ENABLED:-false}
      FUNDING_ADMIN_OIDC_ISSUER: ${FUNDING_ADMIN_OIDC_ISSUER:-}
      FUNDING_ADMIN_OIDC_CLIENT_ID: ${FUNDING_ADMIN_OIDC_CLIENT_ID:-}
      FUNDING_ADMIN_OIDC_CLIENT_SECRET: ${FUNDING_ADMIN_OIDC_CLIENT_SECRET:-}
      FUNDING_ADMIN_OIDC_OWNER_SUBJECTS: ${FUNDING_ADMIN_OIDC_OWNER_SUBJECTS:-}
      FUNDING_ADMIN_OIDC_MFA_ACR: ${FUNDING_ADMIN_OIDC_MFA_ACR:-}
      FUNDING_PROJECT_ID: ${FUNDING_PROJECT_ID:-openg7}
      FUNDING_PRIVATE_DATA_ENCRYPTION_KEY: ${FUNDING_PRIVATE_DATA_ENCRYPTION_KEY:-}
      FUNDING_SPONSORSHIP_FOLLOWUP_TOKEN_TTL_DAYS: ${FUNDING_SPONSORSHIP_FOLLOWUP_TOKEN_TTL_DAYS:-30}
      FUNDING_RATE_LIMIT_WINDOW_MS: ${FUNDING_RATE_LIMIT_WINDOW_MS:-60000}
      FUNDING_PUBLIC_WRITE_RATE_LIMIT_MAX: ${FUNDING_PUBLIC_WRITE_RATE_LIMIT_MAX:-60}
      FUNDING_SPONSORSHIP_FOLLOWUP_RATE_LIMIT_MAX: ${FUNDING_SPONSORSHIP_FOLLOWUP_RATE_LIMIT_MAX:-60}
      FUNDING_REFERENCE_LOOKUP_RATE_LIMIT_MAX: ${FUNDING_REFERENCE_LOOKUP_RATE_LIMIT_MAX:-30}
      FUNDING_REFERENCE_RECOVERY_RATE_LIMIT_MAX: ${FUNDING_REFERENCE_RECOVERY_RATE_LIMIT_MAX:-10}
      FUNDING_ADMIN_RATE_LIMIT_MAX: ${FUNDING_ADMIN_RATE_LIMIT_MAX:-120}
      FUNDING_ADMIN_REVIEW_REMINDER_ENABLED: ${FUNDING_ADMIN_REVIEW_REMINDER_ENABLED:-true}
      FUNDING_ADMIN_REVIEW_REMINDER_MIN_AGE_DAYS: ${FUNDING_ADMIN_REVIEW_REMINDER_MIN_AGE_DAYS:-1}
      FUNDING_ADMIN_REVIEW_REMINDER_POLL_INTERVAL_MS: ${FUNDING_ADMIN_REVIEW_REMINDER_POLL_INTERVAL_MS:-3600000}
      FUNDING_ADMIN_REVIEW_REMINDER_MAX_ITEMS: ${FUNDING_ADMIN_REVIEW_REMINDER_MAX_ITEMS:-5}
      FUNDING_CONTRIBUTION_EMAIL_ENABLED: ${FUNDING_CONTRIBUTION_EMAIL_ENABLED:-false}
      FUNDING_CONTRIBUTION_SMS_MODE: ${FUNDING_CONTRIBUTION_SMS_MODE:-disabled}
      FUNDING_CONTRIBUTION_SMS_MOCK_URL: ${FUNDING_CONTRIBUTION_SMS_MOCK_URL:-}
      STRIPE_SIMULATED_CHECKOUT_ENABLED: ${STRIPE_SIMULATED_CHECKOUT_ENABLED:-false}
      ADMIN_AI_ASSISTANT_ENABLED: ${ADMIN_AI_ASSISTANT_ENABLED:-false}
      ADMIN_AI_PROVIDER: ${ADMIN_AI_PROVIDER:-}
      ADMIN_AI_MODEL: ${ADMIN_AI_MODEL:-}
      ADMIN_AI_API_KEY: ${ADMIN_AI_API_KEY:-}
      ADMIN_AI_MAX_TOOL_CALLS: ${ADMIN_AI_MAX_TOOL_CALLS:-6}
      ADMIN_AI_TIMEOUT_MS: ${ADMIN_AI_TIMEOUT_MS:-15000}
      ADMIN_AI_MAX_MESSAGE_LENGTH: ${ADMIN_AI_MAX_MESSAGE_LENGTH:-2000}
      ADMIN_AI_MAX_ITEMS_PER_TOOL: ${ADMIN_AI_MAX_ITEMS_PER_TOOL:-25}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mail.papamail.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-notify@openg7.org}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-10000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-20000}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OpenG7}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-notify@openg7.org}
      MAIL_REPLY_TO_NAME: ${MAIL_REPLY_TO_NAME:-OpenG7}
      MAIL_REPLY_TO_ADDRESS: ${MAIL_REPLY_TO_ADDRESS:-contact@openg7.org}
      FUNDING_ADMIN_NOTIFICATION_EMAIL: ${FUNDING_ADMIN_NOTIFICATION_EMAIL:-}
      FUNDING_EMAIL_QUEUE_POLL_INTERVAL_MS: ${FUNDING_EMAIL_QUEUE_POLL_INTERVAL_MS:-30000}
      FUNDING_EMAIL_WORKER_ENABLED: ${FUNDING_EMAIL_WORKER_ENABLED:-true}
      FUNDING_EMAIL_QUEUE_BATCH_SIZE: ${FUNDING_EMAIL_QUEUE_BATCH_SIZE:-10}
      FUNDING_SPONSORSHIP_INVOICE_PREFIX: ${FUNDING_SPONSORSHIP_INVOICE_PREFIX:-OG7-CMD}
      FUNDING_INVOICE_ISSUER_NAME: ${FUNDING_INVOICE_ISSUER_NAME:-OpenG7}
      FUNDING_INVOICE_ISSUER_EMAIL: ${FUNDING_INVOICE_ISSUER_EMAIL:-contact@openg7.org}
      FUNDING_INVOICE_ISSUER_ADDRESS: ${FUNDING_INVOICE_ISSUER_ADDRESS:-}
      FUNDING_INVOICE_TAX_ID: ${FUNDING_INVOICE_TAX_ID:-}
      FUNDING_SPONSORSHIP_INVOICE_TAX_LABEL: ${FUNDING_SPONSORSHIP_INVOICE_TAX_LABEL:-Taxes non calculees par la plateforme}
      FUNDING_SPONSORSHIP_INVOICE_LEGAL_NOTE: ${FUNDING_SPONSORSHIP_INVOICE_LEGAL_NOTE:-Facture de commandite descriptive. Ce document ne constitue pas un recu officiel de don de bienfaisance.}
      FUNDING_SPONSORSHIP_CREDIT_NOTE_PREFIX: ${FUNDING_SPONSORSHIP_CREDIT_NOTE_PREFIX:-OG7-AV}
      FUNDING_SPONSORSHIP_CREDIT_NOTE_LEGAL_NOTE: ${FUNDING_SPONSORSHIP_CREDIT_NOTE_LEGAL_NOTE:-Avoir de commandite lie a un remboursement Stripe. Ce document reduit la facture associee du montant indique et ne constitue pas un recu officiel de don de bienfaisance.}
      FUNDING_SPONSOR_LOGO_STORAGE_DIR: ${FUNDING_SPONSOR_LOGO_STORAGE_DIR:-/app/var/sponsor-logos}
      FUNDING_SPONSOR_LOGO_MAX_BYTES: ${FUNDING_SPONSOR_LOGO_MAX_BYTES:-524288}
      FUNDING_SPONSOR_MEDIA_MAX_BYTES: ${FUNDING_SPONSOR_MEDIA_MAX_BYTES:-8388608}
      FUNDING_SPONSOR_MEDIA_MAX_SUPPORTING_IMAGES: ${FUNDING_SPONSOR_MEDIA_MAX_SUPPORTING_IMAGES:-3}
      FUNDING_TRUSTED_PROXY_HOPS: ${FUNDING_TRUSTED_PROXY_HOPS:-1}
      SPONSOR_MEDIA_STORAGE_DRIVER: ${SPONSOR_MEDIA_STORAGE_DRIVER:-local}
      SPONSOR_MEDIA_REGION: ${SPONSOR_MEDIA_REGION:-}
      SPONSOR_MEDIA_ENDPOINT: ${SPONSOR_MEDIA_ENDPOINT:-}
      SPONSOR_MEDIA_PUBLIC_BUCKET: ${SPONSOR_MEDIA_PUBLIC_BUCKET:-}
      SPONSOR_MEDIA_PUBLIC_BASE_URL: ${SPONSOR_MEDIA_PUBLIC_BASE_URL:-}
      SPONSOR_MEDIA_PRIVATE_BUCKET: ${SPONSOR_MEDIA_PRIVATE_BUCKET:-}
      SPONSOR_MEDIA_PRIVATE_BASE_URL: ${SPONSOR_MEDIA_PRIVATE_BASE_URL:-}
      OVH_S3_ACCESS_KEY_ID: ${OVH_S3_ACCESS_KEY_ID:-}
      OVH_S3_SECRET_ACCESS_KEY: ${OVH_S3_SECRET_ACCESS_KEY:-}
      SOCIAL_PUBLICATION_MODE: ${SOCIAL_PUBLICATION_MODE:-disabled}
      SOCIAL_PUBLICATION_MOCK_URL: ${SOCIAL_PUBLICATION_MOCK_URL:-}
      SOCIAL_PUBLICATION_WORKER_ENABLED: ${SOCIAL_PUBLICATION_WORKER_ENABLED:-false}
      SOCIAL_PUBLICATION_OPENG7_FACEBOOK_ACCOUNT_ID: ${SOCIAL_PUBLICATION_OPENG7_FACEBOOK_ACCOUNT_ID:-}
      SOCIAL_PUBLICATION_OPENG7_FACEBOOK_ACCESS_TOKEN: ${SOCIAL_PUBLICATION_OPENG7_FACEBOOK_ACCESS_TOKEN:-}
      SOCIAL_PUBLICATION_OPENG7_FACEBOOK_EXPIRES_AT: ${SOCIAL_PUBLICATION_OPENG7_FACEBOOK_EXPIRES_AT:-}
      SOCIAL_PUBLICATION_OPENG7_LINKEDIN_ACCOUNT_ID: ${SOCIAL_PUBLICATION_OPENG7_LINKEDIN_ACCOUNT_ID:-}
      SOCIAL_PUBLICATION_OPENG7_LINKEDIN_ACCESS_TOKEN: ${SOCIAL_PUBLICATION_OPENG7_LINKEDIN_ACCESS_TOKEN:-}
      SOCIAL_PUBLICATION_OPENG7_LINKEDIN_EXPIRES_AT: ${SOCIAL_PUBLICATION_OPENG7_LINKEDIN_EXPIRES_AT:-}
      SOCIAL_PUBLICATION_OPENG20_FACEBOOK_ACCOUNT_ID: ${SOCIAL_PUBLICATION_OPENG20_FACEBOOK_ACCOUNT_ID:-}
      SOCIAL_PUBLICATION_OPENG20_FACEBOOK_ACCESS_TOKEN: ${SOCIAL_PUBLICATION_OPENG20_FACEBOOK_ACCESS_TOKEN:-}
      SOCIAL_PUBLICATION_OPENG20_FACEBOOK_EXPIRES_AT: ${SOCIAL_PUBLICATION_OPENG20_FACEBOOK_EXPIRES_AT:-}
      SOCIAL_PUBLICATION_OPENG20_LINKEDIN_ACCOUNT_ID: ${SOCIAL_PUBLICATION_OPENG20_LINKEDIN_ACCOUNT_ID:-}
      SOCIAL_PUBLICATION_OPENG20_LINKEDIN_ACCESS_TOKEN: ${SOCIAL_PUBLICATION_OPENG20_LINKEDIN_ACCESS_TOKEN:-}
      SOCIAL_PUBLICATION_OPENG20_LINKEDIN_EXPIRES_AT: ${SOCIAL_PUBLICATION_OPENG20_LINKEDIN_EXPIRES_AT:-}
      SOCIAL_PUBLICATION_FACEBOOK_GRAPH_BASE_URL: ${SOCIAL_PUBLICATION_FACEBOOK_GRAPH_BASE_URL:-https://graph.facebook.com/v25.0}
      SOCIAL_PUBLICATION_FACEBOOK_PAGE_ID: ${SOCIAL_PUBLICATION_FACEBOOK_PAGE_ID:-}
      SOCIAL_PUBLICATION_FACEBOOK_PAGE_ACCESS_TOKEN: ${SOCIAL_PUBLICATION_FACEBOOK_PAGE_ACCESS_TOKEN:-}
      SOCIAL_PUBLICATION_LINKEDIN_API_BASE_URL: ${SOCIAL_PUBLICATION_LINKEDIN_API_BASE_URL:-https://api.linkedin.com/rest}
      SOCIAL_PUBLICATION_LINKEDIN_ORGANIZATION_ID: ${SOCIAL_PUBLICATION_LINKEDIN_ORGANIZATION_ID:-}
      SOCIAL_PUBLICATION_LINKEDIN_ACCESS_TOKEN: ${SOCIAL_PUBLICATION_LINKEDIN_ACCESS_TOKEN:-}
      SOCIAL_PUBLICATION_LINKEDIN_VERSION: ${SOCIAL_PUBLICATION_LINKEDIN_VERSION:-202606}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - sponsor-logos:/app/var/sponsor-logos
    expose:
      - '3333'
    networks:
      - edge
      - data
    restart: unless-stopped
    init: true
    cpus: '0.75'
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3333/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    profiles:
      - database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openg7_funding}
      POSTGRES_USER: ${POSTGRES_USER:-openg7_funding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_only_for_local_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    restart: unless-stopped
    cpus: '0.50'
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-openg7-funding-web:local}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
      traefik:
        condition: service_healthy
    ports:
      - '${WEB_BIND:-127.0.0.1:8080}:8080'
    expose:
      - '8080'
    networks:
      - edge
    restart: unless-stopped
    cpus: '0.50'
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health | grep -q ok']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - '${CADVISOR_BIND:-127.0.0.1:8082}:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - edge
    restart: unless-stopped
    cpus: '0.25'
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  edge:
    name: ${OPENG7_EDGE_NETWORK_NAME:-openg7-edge}
    driver: bridge
  data:
    name: ${OPENG7_DATA_NETWORK_NAME:-openg7-data}
    driver: bridge
    internal: true

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-openg7-postgres-data}
  sponsor-logos:
    name: ${SPONSOR_LOGOS_VOLUME_NAME:-openg7-sponsor-logos}
