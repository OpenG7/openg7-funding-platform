name: Admin acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Checks and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Install encrypted backup tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - run: yarn lint
      - run: yarn exec tsc --noEmit -p tsconfig.json
      - run: yarn test
      - name: Verify every E2E spec is selected without focused or unfinished tests
        run: node scripts/check-e2e-selection.mjs
      - run: docker pull postgres:16-alpine
      - run: docker pull axllent/mailpit:v1.27.4
      - run: docker pull adobe/s3mock:5.1.0
      - name: Prepare isolated admin logo proxy images
        run: |
          docker pull node:22-bookworm-slim
          docker pull nginxinc/nginx-unprivileged:1.27-alpine
          docker pull traefik:v3.7.13
      - name: PostgreSQL integration suites
        run: node --test tests/integration/*.integration.mjs
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-integration-results
          path: test-results/
          retention-days: 7

  admin_ui:
    name: Admin UI (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # Keep one worker per runner and preserve file-level test ordering.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn exec playwright install --with-deps chromium
      - name: Build development Web fixtures and typecheck admin UI
        run: |
          yarn workspace @openg7/funding-web build --configuration development
          yarn exec tsc --noEmit -p tests/tsconfig.admin-ui.json
      - name: Angular SSR and isolated UI fixtures
        run: yarn exec playwright test --config tests/playwright-admin-ui.config.mjs --shard=${{ matrix.shard }}/4
      - name: Preserve admin UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-browser-admin-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  sponsorship_ui:
    name: Sponsorship follow-up, offer and media UI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn exec playwright install --with-deps chromium webkit
      - name: Build development Web fixtures and typecheck follow-up UI
        run: |
          yarn workspace @openg7/funding-web build --configuration development
          yarn exec tsc --noEmit -p tests/tsconfig.followup-ui.json
      - name: Isolated sponsorship follow-up UI
        run: yarn exec playwright test --config tests/playwright-followup-ui.config.mjs
      - name: Frozen offer and media rights UI
        run: |
          yarn exec playwright test --config tests/playwright-sponsorship-offer.config.mjs
          yarn exec playwright test --config tests/playwright-sponsor-media-usage.config.mjs
      - name: Preserve sponsorship UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-browser-sponsorship
          path: test-results/
          retention-days: 7

  public_journeys:
    name: Public journeys, sponsors and moderation UI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn exec playwright install --with-deps chromium firefox webkit
      - name: Build development Web fixtures
        run: yarn workspace @openg7/funding-web build --configuration development
      - name: Public journeys across browsers and accessibility
        run: yarn exec playwright test --config tests/playwright-public-journeys.config.mjs
      - name: Public sponsor directory UI
        run: yarn exec playwright test --config tests/playwright-sponsors-ui.config.mjs
      - name: Moderation UI including mobile WebKit
        run: yarn exec playwright test --config tests/playwright-moderation-ui.config.mjs
      - name: Preserve public journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-browser-public
          path: test-results/
          retention-days: 7

  public_production:
    name: Production transparency and platform accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn exec playwright install --with-deps chromium firefox webkit
      - name: Build production Web fixtures
        run: yarn workspace @openg7/funding-web build --configuration production
      - name: Public transparency across browsers
        run: yarn exec playwright test --config tests/playwright-transparency-ui.config.mjs
      - name: Admin accessibility and HTTP 404 across browsers
        run: yarn exec playwright test --config tests/playwright-platform-accessibility.config.mjs
      - name: Preserve production Web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-browser-platform
          path: test-results/
          retention-days: 7

  identity:
    name: Identity on disposable PostgreSQL and signed OIDC
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Build runtime for identity fixtures
        run: yarn build
      - name: Install encrypted backup tooling for the admin request journey
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - name: Prepare isolated identity providers
        run: |
          docker pull postgres:16-alpine
          docker pull axllent/mailpit:v1.27.4
      - run: yarn exec playwright install --with-deps chromium
      - name: Build production Web fixtures
        run: yarn workspace @openg7/funding-web build --configuration production
      - name: Identity acceptance with disposable PostgreSQL and signed OIDC
        run: yarn exec playwright test --config tests/playwright-identity.config.mjs
      - name: Preserve identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-browser-identity
          path: test-results/
          retention-days: 7

  recovery:
    name: Backup and application recovery on disposable targets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Build runtime for recovery fixtures
        run: yarn build
      - name: Install encrypted backup tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - name: Prepare isolated recovery providers
        run: |
          docker pull postgres:16-alpine
          docker pull adobe/s3mock:5.1.0
      - run: yarn exec playwright install --with-deps chromium
      - name: Build production Web fixtures
        run: yarn workspace @openg7/funding-web build --configuration production
      - name: Backup and application recovery on disposable targets
        run: yarn exec playwright test --config tests/playwright-recovery.config.mjs
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-browser-recovery
          path: test-results/
          retention-days: 7

  # Preserve the existing browser check while requiring every isolated group.
  browser:
    name: Browser, identity and recovery
    needs:
      [
        admin_ui,
        sponsorship_ui,
        public_journeys,
        public_production,
        identity,
        recovery
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser, identity and recovery group to pass
        env:
          ADMIN_UI_RESULT: ${{ needs.admin_ui.result }}
          SPONSORSHIP_UI_RESULT: ${{ needs.sponsorship_ui.result }}
          PUBLIC_JOURNEYS_RESULT: ${{ needs.public_journeys.result }}
          PUBLIC_PRODUCTION_RESULT: ${{ needs.public_production.result }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
        run: |
          printf 'admin=%s sponsorship=%s public=%s platform=%s identity=%s recovery=%s\n' "$ADMIN_UI_RESULT" "$SPONSORSHIP_UI_RESULT" "$PUBLIC_JOURNEYS_RESULT" "$PUBLIC_PRODUCTION_RESULT" "$IDENTITY_RESULT" "$RECOVERY_RESULT"
          for result in "$ADMIN_UI_RESULT" "$SPONSORSHIP_UI_RESULT" "$PUBLIC_JOURNEYS_RESULT" "$PUBLIC_PRODUCTION_RESULT" "$IDENTITY_RESULT" "$RECOVERY_RESULT"; do
            test "$result" = success || exit 1
          done

  docker_acceptance:
    name: Docker acceptance (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # Each runner owns its disposable stack; keep evidence from every shard
      # even when another shard fails. Tests stay sequential within each stack.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn exec playwright install --with-deps chromium
      - name: Docker acceptance with disposable fixtures
        run: yarn test:e2e:acceptance --shard=${{ matrix.shard }}/4
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  keycloak:
    name: Disposable Keycloak identity and initial import
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - name: Prepare disposable identity images
        run: |
          docker pull postgres:16-alpine
          docker build -f docker/keycloak/Dockerfile -t openg7-keycloak:26.8.0-local -t openg7-keycloak:26.8.0 .
      - name: Real Keycloak password, OTP and application identity
        run: node --test tests/identity/keycloak-identity.integration.mjs
      - name: Initial import preserves literal passwords and existing users
        env:
          FUNDING_KEYCLOAK_INITIAL_USER_TEST: '1'
        run: node --test tests/identity/keycloak-initial-user.integration.mjs
      # The full HTTPS/browser rehearsal requires an already trusted mkcert CA.
      # Keep it separate; this job never installs host trust or changes hosts.

  # Keep the existing check successful only when every suite passes.
  acceptance:
    needs: [validation, browser, docker_acceptance, keycloak]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every acceptance suite to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DOCKER_RESULT: ${{ needs.docker_acceptance.result }}
          KEYCLOAK_RESULT: ${{ needs.keycloak.result }}
        run: |
          printf 'validation=%s browser=%s docker=%s keycloak=%s\n' "$VALIDATION_RESULT" "$BROWSER_RESULT" "$DOCKER_RESULT" "$KEYCLOAK_RESULT"
          test "$VALIDATION_RESULT" = success && test "$BROWSER_RESULT" = success && test "$DOCKER_RESULT" = success && test "$KEYCLOAK_RESULT" = success
