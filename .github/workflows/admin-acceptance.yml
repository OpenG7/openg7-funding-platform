name: Admin acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Checks and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Install encrypted backup tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - run: yarn lint
      - run: yarn exec tsc --noEmit -p tsconfig.json
      - run: yarn test
      - run: docker pull postgres:16-alpine
      - run: docker pull axllent/mailpit:v1.27.4
      - run: docker pull adobe/s3mock:5.1.0
      - name: PostgreSQL integration suites
        run: node --test tests/integration/*.integration.mjs
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-integration-results
          path: test-results/
          retention-days: 7

  browser:
    name: Browser, identity and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Build runtime for identity and recovery fixtures
        run: yarn build
      - name: Install encrypted backup tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - name: Prepare isolated integration providers
        run: |
          docker pull postgres:16-alpine
          docker pull axllent/mailpit:v1.27.4
          docker pull adobe/s3mock:5.1.0
      - run: yarn exec playwright install --with-deps chromium firefox webkit
      - name: Build shared development Web fixtures and typecheck UI suites
        run: |
          yarn workspace @openg7/funding-web build --configuration development
          yarn exec tsc --noEmit -p tests/tsconfig.admin-ui.json
          yarn exec tsc --noEmit -p tests/tsconfig.followup-ui.json
      - name: Angular SSR and isolated UI fixtures
        run: yarn exec playwright test --config tests/playwright-admin-ui.config.mjs
      - name: Isolated sponsorship follow-up UI
        run: yarn exec playwright test --config tests/playwright-followup-ui.config.mjs
      - name: Public sponsor directory UI
        run: yarn exec playwright test --config tests/playwright-sponsors-ui.config.mjs
      - name: Public journeys across browsers and accessibility
        run: yarn exec playwright test --config tests/playwright-public-journeys.config.mjs
      - name: Build shared production Web fixtures
        run: yarn workspace @openg7/funding-web build --configuration production
      - name: Admin accessibility and HTTP 404 across browsers
        run: yarn exec playwright test --config tests/playwright-platform-accessibility.config.mjs
      - name: Identity acceptance with disposable PostgreSQL and signed OIDC
        run: yarn exec playwright test --config tests/playwright-identity.config.mjs
      - name: Backup and application recovery on disposable targets
        run: yarn exec playwright test --config tests/playwright-recovery.config.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-browser-results
          path: test-results/
          retention-days: 7

  docker_acceptance:
    name: Docker acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn exec playwright install --with-deps chromium
      - name: Docker acceptance with disposable fixtures
        run: yarn test:e2e:acceptance
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance-results
          path: test-results/
          retention-days: 7

  # Keep the existing check successful only when every suite passes.
  acceptance:
    needs: [validation, browser, docker_acceptance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every acceptance suite to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DOCKER_RESULT: ${{ needs.docker_acceptance.result }}
        run: |
          printf 'validation=%s browser=%s docker=%s\n' "$VALIDATION_RESULT" "$BROWSER_RESULT" "$DOCKER_RESULT"
          test "$VALIDATION_RESULT" = success && test "$BROWSER_RESULT" = success && test "$DOCKER_RESULT" = success
