name: Agent documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/package.json'
      - 'scripts/check-agent-docs.mjs'
      - '.github/workflows/agent-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-agent-docs.mjs
