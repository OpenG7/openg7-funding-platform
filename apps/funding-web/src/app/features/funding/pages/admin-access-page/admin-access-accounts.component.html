<section class="access-panel" aria-labelledby="access-accounts-title">
  <h2 id="access-accounts-title">{{ 'admin.access.accounts' | translate }}</h2>
  <ul>
    @for (account of accounts(); track account.id) {
      <li data-og7="admin-account" [attr.data-og7-id]="account.id">
        <div class="entry-copy">
          <strong>{{ account.displayName }}</strong>
          <span>{{ 'admin.access.roles.' + account.role | translate }}</span>
          @if (account.disabled) {
            <span>({{ 'admin.access.disabled' | translate }})</span>
          }
        </div>
        <button
          type="button"
          class="admin-button"
          (click)="editRequested.emit(account)"
          [openg7AutomaticPrepare]="'access-edit:' + account.id"
          (automaticPrepare)="editRequested.emit(account)"
          [disabled]="busy()"
        >
          {{ 'admin.access.edit' | translate }}
        </button>
      </li>
    }
  </ul>
</section>
