<article
  class="panel endpoint-panel"
  data-og7="webhooks-endpoint"
  data-og7-id="endpoint"
>
  <h2>Endpoint local</h2>
  <p>
    L'URL ci-dessous recoit les evenements Stripe et les transforme en
    mouvements financiers agreges.
  </p>
  <label>
    URL d'endpoint
    <span>
      <code>{{ status().webhookEndpoint }}</code>
      <button
        type="button"
        data-og7="webhooks-copy"
        data-og7-id="endpoint"
        (click)="copyRequested.emit(status().webhookEndpoint)"
      >
        Copier
      </button>
    </span>
  </label>
  <div class="panel-actions">
    <button
      type="button"
      data-og7="webhooks-open"
      data-og7-id="dashboard"
      (click)="openRequested.emit(status().stripeDashboardUrl)"
    >
      Ouvrir Stripe Dashboard ↗
    </button>
    <button
      type="button"
      data-og7="webhooks-refresh"
      data-og7-id="endpoint"
      (click)="refreshRequested.emit()"
    >
      Revalider l'API
    </button>
  </div>
</article>
