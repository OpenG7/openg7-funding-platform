<div
  class="media-review-item"
  data-og7="admin-sponsor-media"
  [attr.data-og7-id]="asset().id"
>
  <div class="media-preview">
    <img
      *ngIf="asset().previewSource"
      [src]="asset().previewSource"
      [alt]="asset().altText || asset().kindLabel"
    />
  </div>

  <div class="media-review-copy">
    <openg7-funding-moderation-actions
      [subject]="{ type: 'media', id: asset().id }"
      [automaticFor]="asset().contributionId ?? null"
      [disabled]="busy()"
      (changed)="moderationChanged.emit()"
    />
    <div class="media-review-heading">
      <strong>{{ asset().kindLabel }}</strong>
      <span [class]="'media-status ' + asset().reviewStatus">
        {{ asset().reviewStatusLabel }}
      </span>
    </div>
    <small>{{ asset().dimensionsLabel }} · {{ asset().sizeLabel }}</small>
    <openg7-admin-sponsor-media-usage
      [asset]="asset()"
      [disabled]="mediaBusy()"
      (busyChange)="setUsageBusy($event)"
      (changed)="moderationChanged.emit()"
    />
    @if (asset().usage?.restrictions) {
      <p>{{ asset().usage?.restrictions }}</p>
      @if (!asset().usageRestrictionsReviewed) {
        <label
          ><input
            type="checkbox"
            [checked]="restrictionsConfirmed()"
            [disabled]="busy()"
            (change)="confirmRestrictions($event)"
            data-og7="admin-media-restrictions-confirmation"
          />{{
            'funding.followup.media.usage.restrictionsConfirmation' | translate
          }}</label
        >
      }
    }
    <label>
      {{ 'admin.legacy.texte_alternatif' | translate
      }}<span>{{ 'admin.legacy.optionnel' | translate }}</span>
      <input
        type="text"
        maxlength="300"
        [attr.placeholder]="
          'admin.legacy.description_publique_automatique_si_vide' | translate
        "
        [value]="altText()"
        (input)="setAltText($event)"
        [disabled]="busy()"
      />
    </label>
    <div class="media-review-actions">
      <button
        type="button"
        class="admin-button"
        [openg7AutomaticPrepare]="'sponsor.media.preview:' + asset().id"
        [automaticFor]="asset().contributionId ?? null"
        (automaticPrepare)="
          previewMedia.emit({
            id: asset().id,
            alt: asset().altText || asset().kindLabel
          })
        "
        (click)="
          previewMedia.emit({
            id: asset().id,
            alt: asset().altText || asset().kindLabel
          })
        "
      >
        {{ 'admin.inspector.preview' | translate }}
      </button>
      <button
        type="button"
        class="approve-action"
        data-og7="admin-media-approve"
        [disabled]="
          busy() ||
          !usageReady() ||
          (asset().reviewStatus === 'approved' &&
            altText().trim() === asset().altText)
        "
        (click)="approve()"
      >
        {{
          (asset().reviewStatus === 'approved'
            ? 'admin.dossier.saveAltText'
            : 'admin.legacy.approuver_le_media'
          ) | translate
        }}
      </button>
      <button
        type="button"
        class="reject-action"
        [disabled]="busy() || asset().reviewStatus === 'rejected'"
        (click)="
          reviewMedia.emit({
            assetId: asset().id,
            expectedVersion: asset().version,
            reviewStatus: 'rejected',
            altText: altText()
          })
        "
      >
        {{ 'admin.legacy.refuser' | translate }}
      </button>
      <button
        type="button"
        class="secondary-danger-action"
        [disabled]="busy()"
        (click)="
          deleteMedia.emit({
            assetId: asset().id,
            expectedVersion: asset().version
          })
        "
      >
        {{ 'admin.legacy.supprimer' | translate }}
      </button>
    </div>
  </div>
</div>
