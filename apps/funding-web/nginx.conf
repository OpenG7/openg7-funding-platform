server {
  listen 8080;
  server_name _;
  # Preserve the external scheme and port behind Traefik or a local Docker
  # mapping when nginx adds a slash to a prerendered directory route.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 256k;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_static on;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  location = /index.html {
    expires -1;
    try_files /index.html =404;
  }

  location = /index.csr.html {
    expires -1;
    try_files /index.csr.html =404;
  }

  location ~* \.(?:html|json|xml|txt)$ {
    expires -1;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    access_log off;
    expires -1;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|woff2?|ttf|eot)$ {
    access_log off;
    expires 1y;
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif|mp3)$ {
    access_log off;
    expires 1h;
    try_files $uri =404;
  }

  location = /api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://api:3333;
  }

  location = /api/sponsorship-followup/media {
    client_max_body_size 9m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://api:3333;
  }

  location /api/ {
    # OIDC callback query parameters contain a single-use authorization code.
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://api:3333;
  }

  # Only declared client-rendered routes receive the application shell.
  location ~ ^/(?:admin/(?:login|auth/callback|fundraiser(?:/(?:attention|assistant|contributions|sponsors|invoices|publications(?:/(?:drafts|batches|calendar))?|expenses|transparency|audit|email-queue|setup|access))?)|dev/(?:stripe-setup|webhooks|api-keys)|(?:en/)?fonds-des-batisseurs/suivi-commandite)/?$ {
    expires -1;
    try_files /index.csr.html =404;
  }

  error_page 404 /404/index.html;
  location = /404/index.html { internal; expires -1; }
  location = /en/404/index.html { internal; expires -1; }
  location /404 { return 404; }
  location /en/404 { error_page 404 /en/404/index.html; return 404; }

  location /en/ {
    expires -1;
    error_page 404 /en/404/index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ =404;
  }

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
